<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מקצוע ביד</title>
<meta name="csrf" content="__CSRF__">
<meta name="base" content="__BASE__">
<style>
/* מקצוע ביד */
:root {
  --bg: #EEF2F5; --surface: #FFFFFF; --ink: #102331; --ink-2: #4A5B68; --line: #D6DEE5;
  --brand: #0B6E99; --brand-ink: #08506F; --brand-soft: #E3F1F7;
  --hat: #F2B33D; --hat-soft: #FDF3DC; --ok: #1E7B4F; --ok-soft: #E3F4EA; --danger: #C2412D; --danger-soft: #FBE9E5;
  --r-lg: 18px; --r: 12px; --r-sm: 8px;
  --sh: 0 1px 2px rgba(16,35,49,.06), 0 6px 18px rgba(16,35,49,.06);
  --font: "Assistant", "Heebo", "Segoe UI", "Rubik", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; overflow-x: hidden; }
a { color: var(--brand-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.3px; }
:focus-visible { outline: 3px solid var(--hat); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.hidden { display: none !important; }

/* header */
.top { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 30; }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 62px; flex-wrap: wrap; }
.brandname { color: #fff; text-decoration: none; font-weight: 800; font-size: 22px; letter-spacing: -.5px; }
.brandname span { color: var(--hat); }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { color: #C9D6DF; text-decoration: none; padding: 7px 12px; border-radius: 999px; font-weight: 600; }
.nav a:hover, .nav a.on { color: #fff; background: rgba(255,255,255,.1); }
.top .grow { flex: 1; }
.top select { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 999px; padding: 5px 10px; }
.top select option { color: var(--ink); }
.userbox { display: flex; align-items: center; gap: 8px; }
.pill-count { background: var(--hat); color: var(--ink); border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 800; margin-right: 4px; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 9px 18px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-ink); }
.btn.hat { background: var(--hat); border-color: var(--hat); color: var(--ink); }
.btn.ghost-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
label.f { display: grid; gap: 5px; }
label.f > span { font-size: 14px; font-weight: 700; color: var(--ink-2); }
label.f > span i { color: var(--danger); font-style: normal; }
input[type=text], input[type=email], input[type=tel], input[type=password], input[type=number], input[type=search], input[type=datetime-local], select, textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; background: #fff; min-height: 42px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; background: #fff; cursor: pointer; font-size: 15px; }
.checks label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
.checks input { accent-color: var(--brand); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--sh); }
.card h2 { font-size: 22px; margin-bottom: 4px; }
.sec { margin: 34px 0 0; }
.sec > h2 { font-size: 26px; margin-bottom: 14px; }
.page-title { font-size: 34px; font-weight: 800; margin: 26px 0 6px; }
.lead { color: var(--ink-2); margin: 0 0 20px; font-size: 18px; }
.tag { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }
.tag.brand { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.tag.hat { background: var(--hat-soft); color: #7A5410; border-color: transparent; }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.notice { border-radius: var(--r); padding: 12px 16px; font-weight: 600; border: 1px solid; margin: 12px 0; }
.notice.warn { background: var(--hat-soft); border-color: #EBCB85; color: #6B4A0E; }
.notice.info { background: var(--brand-soft); border-color: #B7DAEA; color: var(--brand-ink); }
.notice.bad { background: var(--danger-soft); border-color: #EFC2B8; color: var(--danger); }
.stars { color: #C98A10; letter-spacing: 1px; }
.empty { text-align: center; padding: 34px 20px; color: var(--ink-2); background: var(--surface); border: 1.5px dashed var(--line); border-radius: var(--r-lg); }

/* hero */
.hero { background: var(--ink); color: #fff; padding: 46px 0 54px; }
.hero h1 { font-size: clamp(36px, 5.4vw, 64px); font-weight: 800; letter-spacing: -1.5px; }
.hero h1 .u { box-shadow: inset 0 -.22em 0 var(--hat); }
.hero p { color: #C9D6DF; font-size: 19px; max-width: 58ch; margin: 12px 0 26px; }
.searchbar { background: #fff; border-radius: var(--r-lg); padding: 10px; display: grid; grid-template-columns: 2fr 1.2fr 1.2fr auto; gap: 8px; color: var(--ink); box-shadow: 0 14px 40px rgba(0,0,0,.25); }
.searchbar input, .searchbar select { border-color: transparent; background: var(--bg); }
.fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.field-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: var(--ink); display: grid; gap: 2px; }
.field-tile:hover { border-color: var(--brand); }
.field-tile b { font-size: 17px; }
.how { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.how ol { margin: 10px 0 0; padding-right: 22px; display: grid; gap: 8px; }
.trust { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; text-align: center; }
.trust b { display: block; font-size: 34px; font-weight: 800; color: var(--brand-ink); }

/* course card */
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.cc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: var(--ink); box-shadow: var(--sh); transition: transform .15s ease, box-shadow .15s ease; }
.cc:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(16,35,49,.12); }
.cc .band { height: 6px; background: var(--brand); }
.cc.hl .band { background: var(--hat); height: 8px; }
.cc .in { padding: 14px 16px 16px; display: grid; gap: 6px; flex: 1; }
.cc .t { font-weight: 800; font-size: 18px; line-height: 1.3; }
.cc .who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14.5px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; flex: none; }
.avatar.f { background: #F4E8F1; color: #7A2E66; }
.avatar.lg { width: 72px; height: 72px; font-size: 28px; }
.cc .tags { display: flex; flex-wrap: wrap; gap: 5px; }
.cc .cc-foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 9px; margin-top: auto; }
.price { font-weight: 800; font-size: 20px; }
.price small { font-weight: 600; font-size: 13px; color: var(--ink-2); }

/* search */
.search-layout { display: grid; grid-template-columns: 270px 1fr; gap: 22px; align-items: start; margin-top: 18px; }
.filters { position: sticky; top: 80px; }
.filters .stack { gap: 12px; }
.results-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }

/* course page */
.course-layout { display: grid; grid-template-columns: 1fr 330px; gap: 24px; align-items: start; margin-top: 22px; }
.side-sticky { position: sticky; top: 80px; display: grid; gap: 14px; }
.syllabus { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 8px; }
.syllabus li { counter-increment: s; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; background: var(--bg); border-radius: var(--r); padding: 10px 12px; }
.syllabus li::before { content: counter(s); width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; }
.syllabus b { display: block; }
.outcomes { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.outcomes li::before { content: "✓"; color: var(--ok); font-weight: 800; margin-left: 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.facts div { background: var(--bg); border-radius: var(--r); padding: 10px 12px; }
.facts dt { font-size: 13px; color: var(--ink-2); }
.facts dd { margin: 0; font-weight: 700; }
.review { border-top: 1px solid var(--line); padding: 12px 0; }
.review .reply { background: var(--bg); border-radius: var(--r); padding: 8px 12px; margin-top: 8px; font-size: 15px; }

/* panels with side menu */
.panel-layout { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: start; margin-top: 22px; }
.sidemenu { display: grid; gap: 2px; position: sticky; top: 80px; }
.sidemenu a { text-decoration: none; color: var(--ink); padding: 9px 12px; border-radius: var(--r-sm); font-weight: 600; display: flex; justify-content: space-between; }
.sidemenu a:hover { background: var(--surface); }
.sidemenu a.on { background: var(--ink); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stat b { display: block; font-size: 30px; font-weight: 800; }
.stat span { color: var(--ink-2); font-size: 14px; }
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.item .grow { flex: 1; min-width: 200px; }
.item .t { font-weight: 800; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; border-bottom: 1px solid var(--line); }
.tabs a { text-decoration: none; color: var(--ink-2); padding: 9px 14px; font-weight: 700; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--brand); }
table.t { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--r); overflow: hidden; }
table.t th, table.t td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { background: var(--bg); font-size: 14px; color: var(--ink-2); }
.scroll-x { overflow-x: auto; }

/* lead card */
.lead-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: grid; gap: 8px; }
.lead-card.new { border-color: var(--hat); box-shadow: 0 0 0 2px var(--hat-soft); }
.lock { display: inline-flex; gap: 6px; align-items: center; background: var(--bg); border-radius: var(--r-sm); padding: 6px 10px; color: var(--ink-2); font-size: 14px; }
.blur { filter: blur(5px); user-select: none; }

/* wallet */
.packs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.pack { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 18px; text-align: center; display: grid; gap: 6px; }
.pack.pop { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.pack .amt { font-size: 32px; font-weight: 800; }
.balance { display: flex; align-items: baseline; gap: 12px; }
.balance b { font-size: 46px; font-weight: 800; color: var(--brand-ink); }

/* messages */
.chat { display: grid; grid-template-columns: 290px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; min-height: 520px; margin-top: 18px; }
.convs { border-left: 1px solid var(--line); overflow-y: auto; }
.conv { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); align-items: center; }
.conv.on { background: var(--brand-soft); }
.conv .grow { flex: 1; min-width: 0; }
.conv .last { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread { display: flex; flex-direction: column; }
.thread-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.msgs { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; background: var(--bg); max-height: 440px; }
.msg { max-width: 72%; padding: 8px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); align-self: flex-end; }
.msg.me { align-self: flex-start; background: var(--brand); color: #fff; border-color: var(--brand); }
.msg time { display: block; font-size: 11.5px; opacity: .7; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }

/* video room */
.room { background: #0A1620; color: #fff; border-radius: var(--r-lg); overflow: hidden; display: grid; grid-template-columns: 1fr 300px; min-height: 540px; margin-top: 18px; }
.stage video.remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #13232F; border: 0; border-radius: 0; }
.stage .status { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.45); padding: 4px 12px; border-radius: 999px; font-size: 13px; }
.loading { text-align: center; padding: 80px 0; color: var(--ink-2); }
.msg a { color: inherit; }
.stage { position: relative; display: grid; place-items: center; background: #13232F; }
.stage .other { text-align: center; color: #9FB3C2; }
.stage .other .avatar { margin: 0 auto 10px; width: 96px; height: 96px; font-size: 36px; }
.stage video, .stage .self { position: absolute; bottom: 16px; left: 16px; width: 200px; height: 130px; border-radius: 12px; background: #24394A; object-fit: cover; border: 2px solid rgba(255,255,255,.2); display: grid; place-items: center; color: #9FB3C2; font-size: 14px; }
.room-bar { position: absolute; bottom: 16px; right: 50%; transform: translateX(50%); display: flex; gap: 8px; }
.room-bar button { background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.room-bar button.off { background: var(--danger); }
.room-side { background: #fff; color: var(--ink); padding: 16px; overflow-y: auto; }
.room-side label { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }

/* modal & toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10,22,32,.55); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal { background: #fff; border-radius: var(--r-lg); width: min(560px, 100%); max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.modal h2 { font-size: 24px; margin-bottom: 4px; }
.modal .acts { display: flex; gap: 10px; justify-content: flex-start; margin-top: 18px; }
.toast { position: fixed; bottom: 80px; right: 50%; transform: translateX(50%); background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px; font-weight: 700; z-index: 70; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.nedarim { border: 2px solid #2E8A88; border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.nedarim .brandline { color: #2E8A88; font-weight: 800; }

/* demo bar */
.demobar { position: fixed; bottom: 0; right: 0; left: 0; background: var(--hat); color: var(--ink); z-index: 50; }
.demobar .wrap { display: flex; gap: 10px; align-items: center; min-height: 52px; flex-wrap: wrap; font-size: 14.5px; }
.demobar select { width: auto; min-height: 34px; padding: 4px 8px; }
.demobar b { font-weight: 800; }

/* footer */
.foot { background: var(--ink); color: #9FB3C2; margin-top: 50px; padding: 26px 0; font-size: 14px; }
.foot .wrap { display: flex; gap: 20px; justify-content: space-between; flex-wrap: wrap; }
.foot a { color: #C9D6DF; }

/* steps (join wizard) */
.steps { display: flex; gap: 8px; margin: 10px 0 18px; }
.steps div { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
.steps div.on { background: var(--brand); }

@media (max-width: 900px) {
  .search-layout, .course-layout, .panel-layout, .how, .chat, .room { grid-template-columns: 1fr; }
  .filters, .side-sticky, .sidemenu { position: static; }
  .sidemenu { display: flex; overflow-x: auto; }
  .stats, .packs { grid-template-columns: 1fr 1fr; }
  .searchbar { grid-template-columns: 1fr 1fr; }
  .searchbar .q { grid-column: 1 / -1; }
  .convs { border-left: 0; border-bottom: 1px solid var(--line); max-height: 200px; }
  .room-side { max-height: 260px; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 14px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .page-title { font-size: 28px; }
  .top .wrap { padding-top: 8px; padding-bottom: 8px; }
  .nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .searchbar { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .cc { transition: none; } }
</style>

<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main id="app"></main>
<footer class="foot"><div class="wrap">
  <span>מקצוע ביד · לומדים מקצוע ממי שעובד בו</span>
  <span><a href="#/terms">תקנון</a> · <a href="#/terms">פרטיות</a></span>
</div></footer>
<div id="modal"></div>

<script>
'use strict';
/* =====================================================================
   מקצוע ביד. הדפים רצים בדפדפן; הנתונים והכללים בשרת (/miktzoa/api).
   ===================================================================== */
const SITE = 'מקצוע ביד';
const CSRF = document.querySelector('meta[name=csrf]').content;
const BASE = document.querySelector('meta[name=base]').content;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nis = n => '₪' + Number(n || 0).toLocaleString('he-IL');
const uid = p => p + Math.random().toString(36).slice(2, 8);
const now = () => new Date().toISOString();
const daysAgo = d => new Date(Date.now() - d * 864e5).toISOString();
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' }); };
const fmtDT = iso => { const d = new Date(iso); return d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); if (m < 60) return `לפני ${Math.max(m, 1)} דק׳`; const hh = Math.round(m / 60); if (hh < 24) return `לפני ${hh} שע׳`; return `לפני ${Math.round(hh / 24)} ימים`; };

const MODES = { front: 'פרונטלי', video: 'וידאו באתר', phone: 'טלפוני' };
const TRACKS = { practical: 'ידע מעשי', exam: 'הכנה למבחן רישוי', mentor: 'חונכות' };
const LEVELS = { begin: 'מתחילים', adv: 'מתקדמים' };
const SLEVEL = { none: 'בלי רקע', some: 'קצת רקע', working: 'כבר עובד בתחום' };
const STARTS = { week: 'השבוע', month: 'החודש', flex: 'גמיש' };
const CITIES = ['ירושלים', 'בני ברק', 'בית שמש', 'מודיעין עילית', 'ביתר עילית', 'אלעד', 'אשדוד', 'חיפה', 'צפת', 'טבריה', 'רכסים', 'עמנואל', 'חריש', 'נתיבות', 'פתח תקווה', 'נתניה'];
const LEAD_STATUS = { new: 'חדש', open: 'נפתח', declined: 'לא מתאים', expired: 'פג תוקף' };
const PROGRESS = { '': 'לא סומן', contacted: 'יצרתי קשר', scheduled: 'נקבע שיעור', learning: 'התחלנו ללמוד', unreachable: 'לא הצלחתי להשיג' };

/* ---------------- server ---------------- */
let DB = null;
const GKEY = 'miktzoa-guest-gender';
function guestGender() { try { return localStorage.getItem(GKEY) || ''; } catch (e) { return ''; } }
function setGuestGender(v) { try { localStorage.setItem(GKEY, v); } catch (e) { /* ignore */ } DB.session.guestGender = v; }
function setState(st) { DB = st; DB.session.guestGender = guestGender(); }
async function loadState() {
  const r = await fetch(BASE + '/api/state', { credentials: 'same-origin' });
  setState(await r.json());
}
/* every change goes through the server; returns the answer or null (the error is shown as a toast) */
let busy = false;
async function api(action, body = {}, form = null) {
  if (busy) return null;
  busy = true; document.body.style.cursor = 'progress';
  let j = null;
  try {
    const opt = { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF': CSRF } };
    if (form) opt.body = form; else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    const r = await fetch(BASE + '/api/' + action, opt);
    j = await r.json();
  } catch (e) { toast('אין חיבור לשרת. נסה שוב.'); }
  busy = false; document.body.style.cursor = '';
  if (!j) return null;
  if (j.state) setState(j.state);
  if (!j.ok) { toast(j.error || 'משהו השתבש'); return null; }
  return j;
}
function withFile(json, file) { const fd = new FormData(); fd.append('json', JSON.stringify(json)); if (file) fd.append('file', file); return fd; }

const byId = (arr, id) => DB[arr].find(x => x.id === id);
const me = () => DB.session.userId ? byId('users', DB.session.userId) : null;
const myGender = () => (me() ? me().gender : DB.session.guestGender);
const field = id => byId('fields', id) || { name: '' };
const teacherOf = c => byId('users', c.teacherId);
const courseReviews = cid => DB.reviews.filter(r => r.courseId === cid && !r.hidden);
const avg = rs => rs.length ? rs.reduce((s, r) => s + r.stars, 0) / rs.length : 0;
const teacherReviews = tid => DB.reviews.filter(r => !r.hidden && (byId('courses', r.courseId) || {}).teacherId === tid);
const isTeacher = u => !!(u && u.teacher && u.teacher.status === 'approved');
const short = name => { const p = (name || '').split(' '); return p[0] + (p[1] ? ' ' + p[1][0] + '.' : ''); };
const initials = name => (name || '?').trim()[0];
const avatar = (u, cls = '') => `<span class="avatar ${u && u.gender === 'f' ? 'f' : ''} ${cls}">${h(initials(u && u.name))}</span>`;
const starsTxt = n => '★★★★★'.slice(0, Math.round(n)) + '☆☆☆☆☆'.slice(0, 5 - Math.round(n));

/* gender rule: everyone sees everything; contact only man↔man, woman↔woman */
function canContact(teacher) {
  const g = myGender();
  if (!g) return { ok: false, why: 'כדי לפנות למורה צריך קודם לבחור מגדר בשדה "מגדר" למעלה.' };
  if (teacher.gender !== g) return { ok: false, why: teacher.gender === 'm' ? 'זה קורס של מורה. פנייה אפשרית רק בין גבר לגבר ואישה לאישה.' : 'זה קורס של מורה אישה. פנייה אפשרית רק בין גבר לגבר ואישה לאישה.' };
  return { ok: true };
}

/* ---------------- UI helpers ---------------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function modal(html) { $('#modal').innerHTML = `<div class="modal-bg" data-close-bg><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#modal input, #modal select, #modal textarea'); if (f) f.focus(); }
function closeModal() { $('#modal').innerHTML = ''; }
document.addEventListener('click', e => { if (e.target.matches('[data-close-bg]') || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
const formData = form => Object.fromEntries([...new FormData(form).entries()].map(([k, v]) => [k, typeof v === 'string' ? v.trim() : v]));
const checked = (form, name) => $$(`input[name="${name}"]:checked`, form).map(i => i.value);
const opts = (obj, sel, first) => (first !== undefined ? `<option value="">${h(first)}</option>` : '') + Object.entries(obj).map(([k, v]) => `<option value="${h(k)}" ${k === sel ? 'selected' : ''}>${h(v)}</option>`).join('');
const fieldOpts = (sel, first) => (first !== undefined ? `<option value="">${h(first)}</option>` : '') + DB.fields.map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${h(f.name)}</option>`).join('');
const cityOpts = (sel, first) => (first !== undefined ? `<option value="">${h(first)}</option>` : '') + CITIES.map(c => `<option ${c === sel ? 'selected' : ''}>${h(c)}</option>`).join('');
const modeChecks = (name, sel = [], only) => `<div class="checks">${Object.entries(MODES).filter(([k]) => !only || only.includes(k)).map(([k, v]) => `<label><input type="checkbox" name="${name}" value="${k}" ${sel.includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</div>`;
function requireLogin(next) { if (me()) return true; go('#/login?next=' + encodeURIComponent(next || location.hash)); return false; }

/* ---------------- header & demo bar ---------------- */
function renderTop() {
  const u = me(), path = location.hash.split('?')[0];
  const on = p => path.startsWith(p) ? 'on' : '';
  const unread = u ? DB.messages.filter(m => m.to === u.id && !m.read).length : 0;
  $('#top').innerHTML = `
    <a class="brandname" href="#/">מקצוע<span> ביד</span></a>
    <nav class="nav">
      <a href="#/search" class="${on('#/search')}">קורסים</a>
      <a href="#/requests" class="${on('#/requests')}">לוח בקשות</a>
      ${!u || !u.teacher ? `<a href="#/join" class="${on('#/join')}">הצטרף לצוות שלנו</a>` : ''}
      ${isTeacher(u) ? `<a href="#/dash" class="${on('#/dash')}">לוח מורה</a>` : ''}
      ${u && u.role === 'admin' ? `<a href="#/admin" class="${on('#/admin')}">ניהול</a>` : ''}
    </nav>
    <span class="grow"></span>
    ${u ? '' : `<label class="row small" style="gap:6px;flex-wrap:nowrap;white-space:nowrap">מגדר <select id="guest-gender" aria-label="מגדר" style="width:auto"><option value="">בחר</option><option value="m" ${DB.session.guestGender === 'm' ? 'selected' : ''}>זכר</option><option value="f" ${DB.session.guestGender === 'f' ? 'selected' : ''}>נקבה</option></select></label>`}
    <div class="userbox">
      ${u ? `<a class="btn sm ghost-light" href="#/messages">הודעות${unread ? `<span class="pill-count">${unread}</span>` : ''}</a>
             <a class="btn sm ghost-light" href="#/me">${h(short(u.name))}</a>
             <button class="btn sm ghost-light" data-act="logout">יציאה</button>`
          : `<a class="btn sm hat" href="#/login">התחברות</a>`}
    </div>`;
  const gg = $('#guest-gender');
  if (gg) gg.onchange = () => { setGuestGender(gg.value); route(); };
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'logout') api('auth/logout').then(j => { if (j) { go('#/'); toast('יצאת מהחשבון'); } });
});

/* ---------------- cards ---------------- */
function courseCard(c) {
  const t = teacherOf(c), rs = courseReviews(c.id), a = avg(rs);
  return `<a class="cc ${c.highlighted ? 'hl' : ''}" href="#/course/${c.id}">
    <div class="band"></div>
    <div class="in">
      <div class="tags"><span class="tag brand">${h(field(c.fieldId).name)}</span>${c.highlighted ? '<span class="tag hat">מודגש</span>' : ''}${field(c.fieldId).regulated ? '<span class="tag">מקצוע מוסדר</span>' : ''}</div>
      <div class="t">${h(c.title)}</div>
      <div class="who">${avatar(t)}<span>${h(t.name)}${t.teacher.verified ? ' · <b style="color:var(--ok)">מאומת</b>' : ''}<br><span class="small">${t.teacher.years} שנות ניסיון · ${h(t.city)}</span></span></div>
      <div class="tags">${c.modes.map(m => `<span class="tag">${MODES[m]}</span>`).join('')}<span class="tag">${TRACKS[c.track]}</span><span class="tag">${c.sessions} מפגשים</span></div>
      <div class="cc-foot"><span class="price">${nis(c.price)} <small>${c.priceType === 'lesson' ? 'לשיעור' : 'לכל הקורס'}</small></span>
        <span class="small">${rs.length ? `<span class="stars">★</span> ${a.toFixed(1)} (${rs.length})` : '<span class="muted">חדש</span>'}</span></div>
    </div></a>`;
}

/* ---------- search ---------- */
pages.search = params => {
  const p = Object.fromEntries(params);
  const q = (p.q || '').toLowerCase();
  let list = DB.courses.filter(c => c.status === 'active').filter(c => {
    const t = teacherOf(c);
    if (p.field && c.fieldId !== p.field) return false;
    if (p.city && !(c.modes.includes('front') && (t.teacher.areas || [t.city]).includes(p.city))) return false;
    if (p.modes && !p.modes.split(',').some(m => c.modes.includes(m))) return false;
    if (p.mode && !c.modes.includes(p.mode)) return false;
    if (p.pmin && c.price < +p.pmin) return false;
    if (p.pmax && c.price > +p.pmax) return false;
    if (p.tracks && !p.tracks.split(',').includes(c.track)) return false;
    if (p.level && c.level !== p.level) return false;
    if (p.verified && !t.teacher.verified) return false;
    if (p.rating && avg(courseReviews(c.id)) < +p.rating) return false;
    if (q && ![c.title, c.description, t.name, field(c.fieldId).name, ...c.syllabus.map(s => s.title)].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  const sort = p.sort || 'best';
  const score = c => (c.highlighted ? 1000 : 0) + avg(courseReviews(c.id)) * 10 + courseReviews(c.id).length;
  if (sort === 'best') list.sort((a, b) => score(b) - score(a));
  if (sort === 'new') list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (sort === 'price') list.sort((a, b) => a.price - b.price);
  if (sort === 'rating') list.sort((a, b) => avg(courseReviews(b.id)) - avg(courseReviews(a.id)));
  const ms = (p.modes || p.mode || '').split(',').filter(Boolean), ts = (p.tracks || '').split(',').filter(Boolean);
  return `<div class="wrap">
    <h1 class="page-title">${p.field ? 'קורסים ב' + h(field(p.field).name) : 'כל הקורסים'}</h1>
    <div class="search-layout">
      <form class="card filters" id="filters"><div class="stack">
        <label class="f"><span>חיפוש חופשי</span><input type="search" name="q" value="${h(p.q || '')}" placeholder="שם קורס, נושא, מורה"></label>
        <label class="f"><span>תחום</span><select name="field">${fieldOpts(p.field, 'כל התחומים')}</select></label>
        <label class="f"><span>אזור (לפרונטלי)</span><select name="city">${cityOpts(p.city, 'בכל הארץ')}</select></label>
        <div class="f"><span class="small" style="font-weight:700;color:var(--ink-2)">אופן לימוד</span>${modeChecks('modes', ms)}</div>
        <div class="g2"><label class="f"><span>מחיר מ-</span><input type="number" name="pmin" value="${h(p.pmin || '')}" min="0"></label><label class="f"><span>עד</span><input type="number" name="pmax" value="${h(p.pmax || '')}" min="0"></label></div>
        <div class="f"><span class="small" style="font-weight:700;color:var(--ink-2)">מסלול</span><div class="checks">${Object.entries(TRACKS).map(([k, v]) => `<label><input type="checkbox" name="tracks" value="${k}" ${ts.includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</div></div>
        <label class="f"><span>רמה</span><select name="level">${opts(LEVELS, p.level, 'הכל')}</select></label>
        <label class="row small"><input type="checkbox" name="verified" value="1" ${p.verified ? 'checked' : ''}> רק מורים מאומתים</label>
        <label class="f"><span>דירוג מינימלי</span><select name="rating"><option value="">הכל</option><option value="3" ${p.rating === '3' ? 'selected' : ''}>3 ומעלה</option><option value="4" ${p.rating === '4' ? 'selected' : ''}>4 ומעלה</option></select></label>
        <a class="small" href="#/search">ניקוי הסינון</a>
      </div></form>
      <div>
        <div class="results-head"><b>נמצאו ${list.length} קורסים</b>
          <label class="row small">מיון <select id="sort" style="width:auto">${opts({ best: 'מתאים ביותר', new: 'חדשים', price: 'מחיר עולה', rating: 'דירוג' }, sort)}</select></label></div>
        ${list.length ? `<div class="courses">${list.map(courseCard).join('')}</div>` :
          `<div class="empty"><b>לא נמצא קורס מתאים.</b><br>פרסם בקשה בלוח, ומורים מהתחום יפנו אליך.<br><br><a class="btn primary" href="#/requests/new${p.field ? '?field=' + p.field : ''}">פרסום בקשה בלוח</a></div>`}
      </div>
    </div></div>`;
};
pages.search.after = params => {
  const f = $('#filters');
  const apply = () => {
    const d = formData(f), np = new URLSearchParams();
    ['q', 'field', 'city', 'pmin', 'pmax', 'level', 'verified', 'rating'].forEach(k => { if (d[k]) np.set(k, d[k]); });
    const ms = checked(f, 'modes'), ts = checked(f, 'tracks');
    if (ms.length) np.set('modes', ms.join(',')); if (ts.length) np.set('tracks', ts.join(','));
    const s = $('#sort').value; if (s !== 'best') np.set('sort', s);
    const typing = document.activeElement && document.activeElement.name === 'q';
    history.replaceState(null, '', '#/search?' + np.toString()); route();
    if (typing) { const i = $('#filters [name=q]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  };
  f.onchange = apply;
  $('[name=q]', f).oninput = debounce(apply, 400);
  $('#sort').onchange = apply;
};
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

/* ---------- course ---------- */
let lastViewed = null;
pages.course = (params, id) => {
  const c = byId('courses', id);
  if (!c) return notFound();
  const t = teacherOf(c), f = field(c.fieldId), rs = courseReviews(c.id), a = avg(rs), cc = canContact(t);
  const u = me();
  const already = u && DB.leads.find(l => l.courseId === c.id && l.studentId === u.id && l.status !== 'declined' && l.status !== 'expired');
  const own = u && u.id === t.id;
  if (!own && lastViewed !== c.id) { lastViewed = c.id; fetch(BASE + '/api/course/view', { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF': CSRF, 'Content-Type': 'application/json' }, body: JSON.stringify({ id: c.id }) }).catch(() => {}); }
  const more = DB.courses.filter(x => x.status === 'active' && x.fieldId === c.fieldId && x.id !== c.id).slice(0, 4);
  return `<div class="wrap">
    <div class="course-layout">
      <div class="stack" style="gap:18px">
        <div>
          <div class="row" style="gap:6px"><span class="tag brand">${h(f.name)}</span><span class="tag">${TRACKS[c.track]}</span><span class="tag">${LEVELS[c.level]}</span>${c.highlighted ? '<span class="tag hat">מודגש</span>' : ''}</div>
          <h1 class="page-title" style="margin-top:10px">${h(c.title)}</h1>
          <div class="row">${rs.length ? `<span class="stars">${starsTxt(a)}</span> <b>${a.toFixed(1)}</b> <span class="muted">(${rs.length} ביקורות)</span>` : '<span class="muted">עוד אין ביקורות</span>'}</div>

function requestItem(r) {
  const s = byId('users', r.studentId) || {}, u = me(), f = field(r.fieldId);
  const mine = u && u.id === r.studentId, opened = !!r.openedByMe, full = r.opensCount >= DB.settings.maxOpensPerRequest;
  const lead = opened && DB.leads.find(l => l.requestId === r.id && l.teacherId === u.id);
  let action = '';
  if (isTeacher(u) && !mine) {
    const cc = canContact(s);
    if (opened) action = `<a class="btn sm" href="#/leads?id=${lead ? lead.id : ''}">פתחת · לפרטים</a>`;
    else if (!u.teacher.fields.includes(r.fieldId)) action = `<span class="muted small">לא בתחומים שלך</span>`;
    else if (!cc.ok) action = `<span class="muted small">גבר לגבר, אישה לאישה</span>`;
    else action = `<button class="btn sm primary" data-open-req="${r.id}" ${full ? 'disabled' : ''}>${full ? `כבר נפתח ${r.opensCount} פעמים` : `פתיחה ב-${nis(f.leadPrice)}`}</button>`;
  }
  return `<div class="item"><div class="grow">
      <div class="row" style="gap:6px"><span class="tag brand">${h(f.name)}</span><span class="tag">${SLEVEL[r.level]}</span>${r.modes.map(m => `<span class="tag">${MODES[m]}</span>`).join('')}${r.area ? `<span class="tag">${h(r.area)}</span>` : ''}</div>
      <div class="t" style="margin-top:6px">${h(r.text)}</div>
      <div class="muted small">${s.gender === 'f' ? 'תלמידה' : 'תלמיד'} · ${ago(r.createdAt)}${r.budget ? ` · תקציב עד ${nis(r.budget)} לשיעור` : ''} · להתחיל ${STARTS[r.start]} · נפתח על ידי ${r.opensCount} מתוך ${DB.settings.maxOpensPerRequest}</div>
    </div>${action}</div>`;
}

  return `<div class="wrap">

function openRequest(r) {

  if (u.wallet < price) return modal(`<h2>אין מספיק יתרה</h2><p>פתיחת הבקשה עולה ${nis(price)} והיתרה שלך ${nis(u.wallet)}.</p><div class="acts"><a class="btn primary" href="#/credits" data-close>טעינת יתרה</a><button class="btn" data-close>סגירה</button></div>`);
  modal(`<h2>פתיחת הבקשה</h2><p>ייגבו ${nis(price)} מהיתרה (${nis(u.wallet)}). אחרי הפתיחה יוצגו פרטי הקשר של התלמיד.</p><div class="acts"><button class="btn primary" id="yes">פתיחה</button><button class="btn" data-close>ביטול</button></div>`);
  $('#yes').onclick = async () => {
    const j = await api('request/open', { id: r.id });
    closeModal();
    if (!j) return route();
    toast('הבקשה נפתחה'); go('#/leads?id=' + j.leadId);
  };
}

  const j1 = $('#join1');
  if (j1) j1.onsubmit = e => { e.preventDefault(); const d = formData(j1), fields = checked(j1, 'fields'), modes = checked(j1, 'modes');
    if (!fields.length && !d.otherField) return toast('בחר לפחות תחום אחד'); if (fields.length > 5) return toast('עד 5 תחומים'); if (!modes.length) return toast('בחר אופן לימוד');

  const j2 = $('#join2');
  if (j2) j2.onsubmit = e => { e.preventDefault(); const d = formData(j2); if (d.file && d.file.name) joinFile = d.file; store({ credName: d.credName, license: d.license }); go('#/join?step=3'); };

async function startTopup(i, back, zeout) {
  const p = DB.packs[i];
  const j = await api('pay/create', { pack: i, zeout: zeout || '' });
  if (!j) return;
  if (j.needId) {
    modal(`<h2>מספר זהות</h2><p class="muted">נדרים פלוס מבקשים מספר זהות לתשלום. הוא עובר ישירות אליהם ולא נשמר אצלנו.</p>
      <form id="zeout-f" class="stack"><label class="f"><span>מספר זהות</span><input type="text" name="z" inputmode="numeric" pattern="[0-9]{4,9}" maxlength="9" required autocomplete="off"></label>

    $('#zeout-f').onsubmit = e => { e.preventDefault(); const z = e.target.z.value; closeModal(); startTopup(i, back, z); };
    return;
  }
  modal(`<h2>טעינת יתרה ${nis(p.amount)}${p.bonus ? ` <small class="muted">(+${nis(p.bonus)} מתנה)</small>` : ''}</h2>
    <p class="muted small">תשלום מאובטח דרך נדרים פלוס. פרטי הכרטיס לא עוברים דרכנו.</p>
    <div id="pay-box"><iframe id="NedarimFrame" src="${h(j.iframe)}" allow="payment" title="תשלום בנדרים פלוס" style="width:100%;border:0;height:520px"></iframe></div>
    <div id="pay-wait" hidden><h3 id="wait-t">מאשרים את התשלום...</h3><p class="muted" id="wait-x">זה לוקח כמה שניות.</p></div>
    <div class="acts"><button class="btn" data-close>סגירה</button></div>`);
  let polling = false;
  const finish = async (title, text) => {
    $('#pay-box') && ($('#pay-box').hidden = true); if ($('#pay-wait')) { $('#pay-wait').hidden = false; $('#wait-t').textContent = title; $('#wait-x').textContent = text; }
    await loadState();
  };
  payWatch = async () => {
    if (polling) return; polling = true;
    finish('מאשרים את התשלום...', 'זה לוקח כמה שניות.');
    for (let k = 0; k < 40; k++) {
      try { const r = await (await fetch(BASE + '/pay/status/' + j.token, { credentials: 'same-origin' })).json(); if (r.status === 'paid') { await finish('התשלום התקבל, תודה!', 'היתרה נטענה.'); payWatch = null; toast('היתרה נטענה'); setTimeout(() => { closeModal(); back ? go(back) : route(); }, 1400); return; } } catch (e) { /* again */ }
      await new Promise(res => setTimeout(res, 2500));
    }
    finish('התשלום בוצע', 'האישור מנדרים פלוס עוד לא הגיע. היתרה תיטען אוטומטית בדקות הקרובות.');
  };
}

/* ---------- video room (WebRTC between the two browsers; the server only relays connection messages) ---------- */
let stream = null, pc = null, rtcTimer = null, rtcLast = 0, rtcLesson = null, screenTrack = null;
pages.room = (params, id) => {

      <div class="room-side"><b>תוכנית השיעור</b>${c ? `<p class="muted small" style="margin:4px 0 8px">${isT ? 'סמן נושאים שנלמדו' : 'הנושאים שהמורה סימן'}</p>${c.syllabus.map((s, i) => `<label><input type="checkbox" data-done="${i}" ${v.done.includes(i) ? 'checked' : ''} ${isT ? '' : 'disabled'}> ${i + 1}. ${h(s.title)}</label>`).join('')}` : '<p class="muted small">שיעור מלוח הבקשות, ללא סילבוס.</p>'}

async function rtcSend(type, data) {
  try { await fetch(BASE + '/rtc/' + rtcLesson, { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRF': CSRF, 'Content-Type': 'application/json' }, body: JSON.stringify({ type, data }) }); } catch (e) { /* next poll */ }
}
function rtcStatus(t) { const e = $('#rtc-st'); if (e) e.textContent = t; }
function newPeer(isT) {
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: DB.ice });
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.onicecandidate = e => { if (e.candidate) rtcSend('ice', e.candidate.toJSON()); };
  pc.ontrack = e => {
    let vid = $('#remote');
    if (!vid) { vid = document.createElement('video'); vid.id = 'remote'; vid.className = 'remote'; vid.autoplay = true; vid.playsInline = true; $('#stage').prepend(vid); }
    if (vid.srcObject !== e.streams[0]) vid.srcObject = e.streams[0];
    $('#other') && ($('#other').hidden = true);
  };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    rtcStatus({ connected: 'מחובר', connecting: 'מתחבר...', disconnected: 'החיבור נקטע...', failed: 'החיבור נכשל', new: 'ממתין' }[st] || st);
    if (st === 'failed' && isT) offer(isT);
    if (st === 'failed' || st === 'closed') { const r = $('#remote'); if (r) r.remove(); $('#other') && ($('#other').hidden = false); }
  };
  return pc;
}
async function offer(isT) {
  newPeer(isT);
  const o = await pc.createOffer(); await pc.setLocalDescription(o);
  rtcSend('offer', { type: o.type, sdp: o.sdp });
}
async function rtcPoll(isT) {
  try {
    const j = await (await fetch(BASE + '/rtc/' + rtcLesson + '?since=' + rtcLast, { credentials: 'same-origin' })).json();
    if (!j.ok) { rtcStatus(j.error || 'אין גישה'); return; }
    const first = rtcLast === 0; rtcLast = j.last;
    if (first) return;
    for (const m of j.items) {
      if (m.type === 'hello') { $('#other-st') && ($('#other-st').textContent = 'הצטרף, מתחברים...'); if (isT) await offer(isT); else rtcSend('here', {}); }
      else if (m.type === 'here' && isT) await offer(isT);
      else if (m.type === 'offer' && !isT) {
        newPeer(isT); await pc.setRemoteDescription(m.data);
        const a = await pc.createAnswer(); await pc.setLocalDescription(a); rtcSend('answer', { type: a.type, sdp: a.sdp });
      } else if (m.type === 'answer' && isT && pc && pc.signalingState === 'have-local-offer') await pc.setRemoteDescription(m.data);
      else if (m.type === 'ice' && pc && pc.remoteDescription) { try { await pc.addIceCandidate(m.data); } catch (e) { /* stale */ } }
      else if (m.type === 'bye') { if (pc) { pc.close(); pc = null; } const r = $('#remote'); if (r) r.remove(); if ($('#other')) { $('#other').hidden = false; $('#other-st').textContent = 'יצא מהשיעור'; } rtcStatus('ממתין'); }
    }
  } catch (e) { rtcStatus('אין חיבור לשרת'); }
}
pages.room.after = (params, id) => {
  const v = byId('lessons', id); if (!v || !$('#join')) return;
  const l = byId('leads', v.leadId), isT = me().id === l.teacherId;
  $$('[data-done]').forEach(cb => cb.onchange = async () => {
    const done = $$('[data-done]:checked').map(x => +x.dataset.done);
    if (await api('lesson/done', { id: v.id, done })) toast('נשמר');
  });
  $('#join').onclick = async () => {
    if (!window.RTCPeerConnection || !navigator.mediaDevices) return toast('הדפדפן הזה לא תומך בשיעורי וידאו. נסה כרום או אדג׳ מעודכן.');
    try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); }
    catch (e) { try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); toast('אין גישה למצלמה, מצטרפים בקול בלבד'); } catch (e2) { return toast('צריך לאשר גישה למיקרופון ולמצלמה בדפדפן'); } }
    const vid = document.createElement('video'); vid.autoplay = true; vid.muted = true; vid.playsInline = true; vid.srcObject = stream; vid.className = 'self-v'; $('#self').replaceWith(vid); vid.id = 'self';
    ['mic', 'cam', 'share'].forEach(x => { $('#' + x).hidden = false; }); $('#join').hidden = true;
    $('#other-st').textContent = 'ממתין שיצטרף...'; rtcStatus('ממתין');
    rtcLesson = v.id; rtcLast = 0;
    await rtcPoll(isT); await rtcSend('hello', {});
    rtcTimer = setInterval(() => rtcPoll(isT), 1200);
  };
  $('#cam').onclick = () => { if (!stream) return; stream.getVideoTracks().forEach(t => { t.enabled = !t.enabled; }); $('#cam').classList.toggle('off'); };
  $('#mic').onclick = () => { if (!stream) return; stream.getAudioTracks().forEach(t => { t.enabled = !t.enabled; }); $('#mic').classList.toggle('off'); };
  $('#share').onclick = async () => {

    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (!sender) return toast('אין מצלמה פעילה לשיתוף');
    if (screenTrack) { screenTrack.stop(); return; }
    try {
      const ds = await navigator.mediaDevices.getDisplayMedia({ video: true });
      screenTrack = ds.getVideoTracks()[0]; await sender.replaceTrack(screenTrack); $('#share').classList.add('off');
      screenTrack.onended = async () => { screenTrack = null; const cam = stream.getVideoTracks()[0]; if (pc) await sender.replaceTrack(cam); $('#share') && $('#share').classList.remove('off'); };
    } catch (e) { /* cancelled */ }
  };
  $('#leave').onclick = () => { go('#/messages/' + l.id); };
};
function stopStream() {
  if (rtcTimer) { clearInterval(rtcTimer); rtcTimer = null; if (rtcLesson) rtcSend('bye', {}); }
  if (pc) { pc.close(); pc = null; }

}
window.addEventListener('beforeunload', () => { if (rtcLesson) navigator.sendBeacon && rtcSend('bye', {}); });

pages.review.after = (params, leadId) => {
  const f = $('#rev'); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault(); const d = formData(f);

  } else if (tab === 'reports') {
    body = pendR.map(r => { const l = byId('leads', r.leadId) || {}, t = byId('users', l.teacherId) || {}; return `<div class="item"><div class="grow"><b>${{ wrong: 'מספר שגוי', joke: 'פנייה לא רצינית', dup: 'פנייה כפולה', other: 'אחר', chat: 'דיווח על שיחה' }[r.reason]}</b><div class="muted small">מורה: ${h(t.name)} · ${h(r.text)} · ${ago(r.at)}</div></div>
      ${r.reason !== 'chat' ? `<button class="btn sm primary" data-refund="${r.id}">אישור והחזר ${nis(l.price)}</button>` : ''}<button class="btn sm" data-dismiss="${r.id}">סגירה</button></div>`; }).join('') || '<div class="empty">אין דיווחים פתוחים.</div>';
  } else if (tab === 'users') {
    body = `<div class="scroll-x"><table class="t"><tr><th>שם</th><th>מגדר</th><th>תפקיד</th><th>מייל</th><th>יתרה</th><th></th></tr>${DB.users.map(x => `<tr><td>${h(x.name)}</td><td><select data-u-gender="${x.id}" style="width:auto">${opts({ m: 'זכר', f: 'נקבה' }, x.gender)}</select></td><td>${x.role === 'admin' ? 'מנהל' : isTeacher(x) ? 'מורה' : x.teacher ? (x.teacher.status === 'rejected' ? 'מורה שנדחה' : 'מורה ממתין') : 'תלמיד'}${x.blocked ? ' <span class="tag danger">חסום</span>' : ''}</td><td dir="ltr">${h(x.email)}</td><td>${x.teacher ? nis(x.wallet) : '—'}</td>

pages.admin.after = () => {
  const on = (sel, fn) => $$(sel).forEach(b => b.addEventListener('click', async () => { const r = await fn(b); if (r !== false) route(); }));
  const call = async (a, body, msg) => { const j = await api(a, body); if (j && msg) toast(msg); return j; };
  on('[data-approve-t]', b => call('admin/teacher', { id: b.dataset.approveT, action: 'approve' }, 'המורה אושר'));
  on('[data-reject-t]', b => { const why = prompt('סיבת הדחייה (תישלח למורה):'); if (why === null) return false; return call('admin/teacher', { id: b.dataset.rejectT, action: 'reject', reason: why }, 'נדחה'); });
  on('[data-cred-ok]', b => call('admin/cred', { id: b.dataset.credOk, ok: true }, 'ניתן תג מאומת'));
  on('[data-cred-no]', b => call('admin/cred', { id: b.dataset.credNo, ok: false }, 'התעודה נדחתה'));
  on('[data-c-ok]', b => call('admin/course', { id: b.dataset.cOk, action: 'approve' }, 'הקורס עלה לאתר'));
  on('[data-c-back]', b => { const why = prompt('מה צריך לתקן? (יישלח למורה)'); if (why === null) return false; return call('admin/course', { id: b.dataset.cBack, action: 'back', reason: why }, 'הוחזר למורה לתיקון'); });
  on('[data-refund]', b => call('admin/report', { id: b.dataset.refund, action: 'refund' }, 'הוחזר ליתרה'));
  on('[data-dismiss]', b => call('admin/report', { id: b.dataset.dismiss, action: 'close' }));
  on('[data-credit]', b => { const v = +prompt('כמה להוסיף ליתרה (₪)? אפשר גם מספר שלילי'); if (!v) return false; return call('admin/user', { id: b.dataset.credit, credit: v }, 'עודכן'); });
  on('[data-block]', b => { const x = byId('users', b.dataset.block); return call('admin/user', { id: x.id, block: !x.blocked }, x.blocked ? 'החסימה בוטלה' : 'נחסם'); });
  $$('[data-u-gender]').forEach(s => s.onchange = async () => { if (await api('admin/user', { id: s.dataset.uGender, gender: s.value })) toast('עודכן'); });
  const saveField = async id => { const j = await api('admin/field', { id, name: $(`[data-f-name="${id}"]`).value, regulated: $(`[data-f-reg="${id}"]`).checked, leadPrice: +$(`[data-f-price="${id}"]`).value }); if (j) toast('התחום עודכן'); };
  $$('[data-f-price],[data-f-reg],[data-f-name]').forEach(i => i.onchange = () => saveField(i.dataset.fPrice || i.dataset.fReg || i.dataset.fName));
  const af = $('#add-field'); if (af) af.onsubmit = async e => { e.preventDefault(); const d = formData(af); if (await api('admin/field', { new: true, name: d.name, leadPrice: +d.price })) { toast('התחום נוסף'); route(); } };
  const st = $('#settings'); if (st) st.onsubmit = async e => { e.preventDefault(); const d = formData(st); const b = {}; Object.keys(d).forEach(k => { b[k] = +d[k]; }); if (await api('admin/settings', b)) toast('נשמר'); };
};

pages.terms = () => `<div class="wrap" style="max-width:760px"><h1 class="page-title">תקנון ומדיניות פרטיות</h1><div class="card stack">
  <p style="margin:0">טיוטה. את הנוסח הסופי צריך עורך דין.</p>
  <ol style="margin:0;padding-right:20px;display:grid;gap:8px"><li>האתר מחבר בין מורים לתלמידים ואינו צד להסכם הלימוד ביניהם.</li><li>בתחומים מוסדרים, הלימוד באתר אינו מקנה רישיון.</li><li>פנייה ותקשורת בין מורה לתלמיד מתאפשרות רק בין גבר לגבר ואישה לאישה.</li><li>מורה משלם על פתיחת ליד לפי המחיר שנקבע לקורס. ליד לא תקין שדווח תוך 7 ימים ואושר, מוחזר ליתרה.</li><li>שיעורי וידאו באתר אינם מוקלטים, והשיחה עוברת ישירות בין המשתתפים.</li><li>תשלום על יתרה מתבצע דרך נדרים פלוס. היתרה משמשת לפתיחת לידים ולהדגשת קורסים.</li><li>פרטים אישיים נמסרים למורה רק אחרי שפתח את הפנייה.</li></ol></div></div>`;
function notFound() { return `<div class="wrap"><div class="empty" style="margin-top:40px"><b>העמוד לא נמצא.</b><br><a href="#/">לדף הבית</a></div></div>`; }

/* ---------------- router ---------------- */
const ROUTES = [
  [/^#?\/?$/, 'home'], [/^#\/search$/, 'search'], [/^#\/course\/new$/, 'editCourse'], [/^#\/course\/([\w-]+)\/edit$/, 'editCourse'], [/^#\/course\/([\w-]+)$/, 'course'],
  [/^#\/teacher\/([\w-]+)$/, 'teacher'], [/^#\/login$/, 'login'], [/^#\/register$/, 'register'], [/^#\/forgot$/, 'forgot'], [/^#\/reset$/, 'reset'], [/^#\/requests$/, 'requests'], [/^#\/requests\/new$/, 'newRequest'],
  [/^#\/me$/, 'me'], [/^#\/join$/, 'join'], [/^#\/dash$/, 'dash'], [/^#\/leads$/, 'leads'], [/^#\/credits$/, 'credits'], [/^#\/courses$/, 'courses'], [/^#\/lessons$/, 'lessons'],
  [/^#\/profile$/, 'profile'], [/^#\/messages$/, 'messages'], [/^#\/messages\/([\w-]+)$/, 'messages'], [/^#\/room\/([\w-]+)$/, 'room'], [/^#\/review\/([\w-]+)$/, 'review'],
  [/^#\/admin$/, 'admin'], [/^#\/terms$/, 'terms'],
];
function route() {
  stopStream();
  const [path, qs] = (location.hash || '#/').split('?');
  const params = new URLSearchParams(qs || '');
  let name = null, arg;
  for (const [re, n] of ROUTES) { const m = path.match(re); if (m) { name = n; arg = m[1]; break; } }
  stopChatPoll();
  renderTop();
  const page = name && pages[name];
  $('#app').innerHTML = page ? page(params, arg) : notFound();
  if (page && page.after) page.after(params, arg);
  if (!qs || !qs.includes('id=')) window.scrollTo(0, 0);
}
/* new messages arrive while a conversation is open */
let chatTimer = null;
function stopChatPoll() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }
function startChatPoll(leadId) {
  stopChatPoll();
  chatTimer = setInterval(async () => {
    if (document.hidden || $('#modal').innerHTML || busy) return;
    const comp = $('#composer'); if (!comp || comp.text.value || comp.file.files.length) return;
    const before = DB.messages.length;
    try { await loadState(); } catch (e) { return; }
    if (DB.messages.length !== before && location.hash.startsWith('#/messages')) route();
  }, 8000);
}
/* every page change also brings fresh data from the server */
window.addEventListener('hashchange', async () => { closeModal(); try { await loadState(); } catch (e) { /* show what we have */ } route(); });
$('#app').innerHTML = '<div class="loading">טוען...</div>';
loadState().then(route).catch(() => { $('#app').innerHTML = '<div class="wrap"><div class="empty" style="margin-top:40px">אין חיבור לשרת. <a href="javascript:location.reload()">לנסות שוב</a></div></div>'; });
</script>
